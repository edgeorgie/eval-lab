name: eval-lab CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run eval-lab (demo model, no API key) — expect PASS
        id: baseline
        uses: ./
        with:
          config: cli/examples/eval.config.baseline.json
          model: demo
          out: baseline.run.json

      - name: Run eval-lab against a regressed prompt — expect FAIL
        id: regressed
        uses: ./
        continue-on-error: true
        with:
          config: cli/examples/eval.config.regressed.json
          model: demo
          baseline: baseline.run.json
          out: regressed.run.json

      - name: Verify the regression run actually failed
        run: |
          if [ "${{ steps.regressed.outputs.passed }}" = "true" ]; then
            echo "Expected the regressed prompt variant to fail CI, but it passed. Something is wrong with eval-lab's regression detection."
            exit 1
          fi
          echo "Confirmed: eval-lab correctly failed CI on a real prompt regression (verbose reply exceeds max_words)."

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-lab-runs
          path: |
            baseline.run.json
            regressed.run.json

  # The eval job drives the Action end to end but never runs the CLI's own unit tests, so a
  # regression in cli/bin or cli/src would not turn CI red. The CLI has no dependencies, so no install.
  cli-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run CLI unit tests
        working-directory: cli
        run: npm test

  # Runs the root package's own `verify` script (typecheck -> lint -> spec:check
  # -> test -> build). The two jobs above cover the composite Action and the CLI;
  # neither invokes the typechecker, so before this job existed a type error on
  # `main` could not turn a pull request red. One was in fact sitting there:
  # `npm run verify` on a clean clone failed with `TS2304: Cannot find name
  # 'LayoutProps'`.
  #
  # `LayoutProps` is generated by Next into `.next/types`, so typegen must precede
  # `tsc --noEmit` or the typecheck dies on a missing name rather than on a real
  # type error. The sibling Next repos in this portfolio order it the same way.
  #
  # This job, `eval` and `cli-test` are all required status checks on `main` with
  # strict up-to-date branches. The gate has been observed rejecting a real
  # defect, not merely passing: a probe pull request carrying a deliberate type
  # error produced a red `verify` and GitHub refused the merge.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # This job only reads the tree; not persisting the token keeps it out of
          # .git/config for every later step.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Must precede the typecheck: generates the LayoutProps/PageProps types
      # that files under app/ reference.
      - run: npx next typegen

      # Invokes the repo's own script rather than restating its steps here, so
      # this workflow cannot drift from what a developer runs locally.
      - run: npm run verify
