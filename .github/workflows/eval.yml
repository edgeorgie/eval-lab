name: eval-lab CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run eval-lab (demo model, no API key) — expect PASS
        id: baseline
        uses: ./
        with:
          config: cli/examples/eval.config.baseline.json
          model: demo
          out: baseline.run.json

      - name: Run eval-lab against a regressed prompt — expect FAIL
        id: regressed
        uses: ./
        continue-on-error: true
        with:
          config: cli/examples/eval.config.regressed.json
          model: demo
          baseline: baseline.run.json
          out: regressed.run.json

      - name: Verify the regression run actually failed
        run: |
          if [ "${{ steps.regressed.outputs.passed }}" = "true" ]; then
            echo "Expected the regressed prompt variant to fail CI, but it passed. Something is wrong with eval-lab's regression detection."
            exit 1
          fi
          echo "Confirmed: eval-lab correctly failed CI on a real prompt regression (verbose reply exceeds max_words)."

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-lab-runs
          path: |
            baseline.run.json
            regressed.run.json

  # The eval job drives the Action end to end but never runs the CLI's own unit tests, so a
  # regression in cli/bin or cli/src would not turn CI red. The CLI has no dependencies, so no install.
  cli-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run CLI unit tests
        working-directory: cli
        run: npm test
